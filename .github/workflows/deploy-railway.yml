name: Deploy to Railway

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: npm run build

    - name: Deploy to Railway via API
      if: ${{ env.RAILWAY_TOKEN != '' && env.RAILWAY_PROJECT_ID != '' }}
      run: |
        echo "Deploying to Railway..."
        echo "Project ID: $RAILWAY_PROJECT_ID"
        
        # Create deployment via GitHub + Railway integration
        # Railway will automatically detect and deploy from GitHub
        
    - name: Deployment Status
      run: |
        echo "✅ Build completed successfully"
        echo ""
        echo "Railway deployment will be triggered by:"
        echo "1. Connecting GitHub repo to Railway"
        echo "2. Setting environment variables in Railway dashboard"
        echo "3. Railway will auto-deploy on push to main"
        echo ""
        echo "To manually trigger deployment:"
        echo "  railway up --service mgw"
        echo ""
        echo "Monitor at: https://railway.app/project/$RAILWAY_PROJECT_ID"
