name: Build and Deploy to Railway

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to Railway'
        required: false
        default: 'true'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: npm run build

    - name: Run tests (if available)
      run: npm run test 2>/dev/null || echo "No tests configured"

    - name: Build Docker image
      run: |
        docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .
        docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest .

    - name: Log in to Container Registry
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Push Docker image
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

    - name: Trigger Railway Deployment
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        echo "✅ Build successful - Ready for Railway deployment"
        echo "Docker image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
        echo ""
        echo "Railway will automatically deploy via:"
        echo "1. GitHub webhook (if connected)"
        echo "2. Or manual trigger from Railway dashboard"
        echo ""
        echo "To complete deployment:"
        echo "1. Go to https://railway.app/dashboard"
        echo "2. Connect this repository"
        echo "3. Railway will auto-deploy on each push"

    - name: Deployment Summary
      if: always()
      run: |
        echo "════════════════════════════════════════"
        echo "Build Pipeline Complete"
        echo "════════════════════════════════════════"
        echo ""
        echo "Commit: ${{ github.sha }}"
        echo "Branch: ${{ github.ref }}"
        echo "Actor: ${{ github.actor }}"
        echo ""
        echo "Artifact: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
        echo ""
        if [ "${{ job.status }}" == "success" ]; then
          echo "Status: ✅ SUCCESS"
          echo ""
          echo "Next: Connect to Railway for auto-deployment"
        else
          echo "Status: ❌ FAILED"
          echo "Check logs above for details"
        fi
        echo "════════════════════════════════════════"
